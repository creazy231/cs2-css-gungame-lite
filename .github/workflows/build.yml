name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_NAME: "GunGameLite"
  PROJECT_PATH: "./GunGameLite/GunGameLite.csproj"
  OUTPUT_PATH: "./GunGameLite/GunGameLite"
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Test
        run: dotnet test -c Release --no-restore

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release -o ${{ env.OUTPUT_PATH }}

  # Cuts a GitHub Release automatically whenever the plugin's ModuleVersion is
  # bumped on main. It reads the version from GunGameLitePlugin.cs and creates a
  # vX.Y.Z tag + release with GunGameLite.zip attached, but only if that version
  # has not been released yet — so ordinary pushes that don't change the version
  # are a no-op.
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[0-9]+\.[0-9]+\.[0-9]+' GunGameLite/GunGameLitePlugin.cs)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse ModuleVersion from GunGameLite/GunGameLitePlugin.cs"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected plugin version v$VERSION"

      - name: Check whether this version is already released
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — nothing to release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} is new — a release will be created."
          fi

      - name: Setup .NET
        if: steps.exists.outputs.released == 'false'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        if: steps.exists.outputs.released == 'false'
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release -o ${{ env.OUTPUT_PATH }}

      - name: Clean files
        if: steps.exists.outputs.released == 'false'
        run: |
          rm -f \
            ${{ env.OUTPUT_PATH }}/GunGameLite.deps.json \
            ${{ env.OUTPUT_PATH }}/GunGameLite.pdb

      # The zip holds GunGameLite/GunGameLite.dll, so extracting it into the CSS plugins folder
      # gives plugins/GunGameLite/GunGameLite.dll, the only layout CSS loads. Zipping
      # ./GunGameLite/GunGameLite from the repo root nested it one level too deep.
      - name: Zip
        if: steps.exists.outputs.released == 'false'
        working-directory: ./GunGameLite
        run: zip -r ../${{ env.PROJECT_NAME }}.zip ${{ env.PROJECT_NAME }}

      - name: Create Release
        if: steps.exists.outputs.released == 'false'
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "${{ env.PROJECT_NAME }}.zip"
          name: "${{ steps.version.outputs.tag }}"
          tag: "${{ steps.version.outputs.tag }}"
          commit: ${{ github.sha }}
          makeLatest: true
          skipIfReleaseExists: true
          body: |
            ## GunGame Lite ${{ steps.version.outputs.version }}

            ### Installation
            1. Download **`GunGameLite.zip`** below.
            2. Extract it into `game/csgo/addons/counterstrikesharp/plugins/` on your CS2 server, so you end up with `plugins/GunGameLite/GunGameLite.dll`.
            3. Restart the server, or run `css_plugins load GunGameLite` in the console.

            Requires [CounterStrikeSharp](https://github.com/roflmuffin/CounterStrikeSharp) v1.0.371+ and a server in Casual mode (`+game_type 0 +game_mode 0`).
            See the [README](https://github.com/creazy231/cs2-css-gungame-lite#tested-with) for the CS2 / CounterStrikeSharp versions this release was tested with.
